services:
  - type: web
    name: ecatic-site
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://ecatic-site.onrender.com
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: ADMIN_NAME
        value: Administrateur ECATIC
      - key: ADMIN_EMAIL
        value: admin@ecatic.sn
      - key: ADMIN_PASSWORD
        sync: false
